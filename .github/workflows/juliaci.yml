name: Julia CI

on:
  push: {branches: [main, master], tags: ['**']}
  pull_request: {types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]}
  issue_comment: {types: [created]}
  workflow_dispatch:
    inputs:
      feature:
        type: choice
        description: What to run
        options: [DocDeploy, LintAndTest, TagBot]

jobs:
  julia-ci:
    if: github.event_name != 'issue_comment' || github.actor == 'JuliaTagBot'
    uses: julia-testitems/testitem-workflow/.github/workflows/juliaci.yml@v2
    permissions:
      actions: write
      contents: write
      checks: read
      issues: read
      discussions: read
      pull-requests: read
      statuses: write
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}